name: Notebook release execution (GPU)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-notebooks:
    # REL1 requires the supported CUDA path; do not replace this with CPU execution.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 90
    env:
      DIMER_NOTEBOOK_REF: ${{ github.sha }}
      GITHUB_TOKEN: ${{ secrets.DIMER_FINETUNER_READ_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Verify executor prerequisites
        run: |
          if [[ -z "${GITHUB_TOKEN:-}" ]]; then
            echo "DIMER_FINETUNER_READ_TOKEN is required to read the private language-model-finetuner source." >&2
            exit 1
          fi
          nvidia-smi
          python - <<'PY'
          import torch
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is required for the Notebook Spec release path")
          print("torch", torch.__version__, "cuda", torch.version.cuda, "gpu", torch.cuda.get_device_name(0))
          PY

      - name: Prepare clean notebook workspace
        run: |
          sudo mkdir -p /content
          sudo chown -R "$USER":"$USER" /content
          rm -rf /content/language-model-tutorial /content/language-model-finetuner /content/dimer-language-model-artifact
          rm -f /content/artifact_inference_predictions.jsonl /content/artifact_inference_provenance.json
          python -m pip install --upgrade pip==26.2.1
          python -m pip install nbconvert==7.17.1 ipykernel==7.3.0

      - name: Execute E2E production QLoRA path
        id: e2e
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute tutorials/language_model_finetuning_colab.ipynb \
            --output executed-language-model-e2e.ipynb \
            --output-dir /content \
            --ExecutePreprocessor.timeout=4500 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Prepare external-artifact upload shim
        id: prepare-inference
        run: |
          test -f /content/language-model-tutorial/dimer-language-model-adapter.zip
          mkdir -p /tmp/colab-shim/google/colab
          cat > /tmp/colab-shim/google/__init__.py <<'PY'
          from pkgutil import extend_path
          __path__ = extend_path(__path__, __name__)
          PY
          cat > /tmp/colab-shim/google/colab/__init__.py <<'PY'
          from . import files
          PY
          cat > /tmp/colab-shim/google/colab/files.py <<'PY'
          import json
          import os
          from pathlib import Path

          _queue = None
          _index = 0

          def upload():
              global _queue, _index
              if _queue is None:
                  _queue = json.loads(os.environ["COLAB_UPLOAD_QUEUE"])
              if _index >= len(_queue):
                  raise RuntimeError("No staged CI upload remains for this notebook call.")
              paths = [Path(p) for p in _queue[_index]]
              _index += 1
              missing = [str(p) for p in paths if not p.is_file()]
              if missing:
                  raise FileNotFoundError(f"Missing staged CI upload(s): {missing}")
              return {p.name: p.read_bytes() for p in paths}
          PY
          {
            echo 'PYTHONPATH=/tmp/colab-shim'
            echo 'COLAB_UPLOAD_QUEUE=[["/content/language-model-tutorial/dimer-language-model-adapter.zip"]]'
          } >> "$GITHUB_ENV"

      - name: Execute ARTIFACT-INFERENCE in a fresh kernel
        id: artifact-inference
        run: |
          # A separate nbconvert invocation creates a separate kernel/process while consuming
          # only the serialized adapter ZIP produced by the E2E invocation.
          jupyter nbconvert \
            --to notebook \
            --execute tutorials/language_model_artifact_inference_colab.ipynb \
            --output executed-language-model-artifact-inference.ipynb \
            --output-dir /content \
            --ExecutePreprocessor.timeout=2700 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Assert release outputs
        id: assert-outputs
        run: |
          test -f /content/language-model-tutorial/dimer-language-model-adapter.zip
          test -f /content/artifact_inference_predictions.jsonl
          test -f /content/artifact_inference_provenance.json
          test -f /content/executed-language-model-e2e.ipynb
          test -f /content/executed-language-model-artifact-inference.ipynb

      - name: Upload release evidence
        id: upload-evidence
        if: ${{ always() && steps.e2e.outcome == 'success' && steps.prepare-inference.outcome == 'success' && steps.artifact-inference.outcome == 'success' && steps.assert-outputs.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: language-model-notebook-release-evidence
          path: |
            /content/executed-language-model-e2e.ipynb
            /content/executed-language-model-artifact-inference.ipynb
            /content/language-model-tutorial/dimer-language-model-adapter.zip
            /content/artifact_inference_predictions.jsonl
            /content/artifact_inference_provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Record release evidence summary
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare-inference.outcome }}
          INFERENCE_OUTCOME: ${{ steps.artifact-inference.outcome }}
          OUTPUT_OUTCOME: ${{ steps.assert-outputs.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-evidence.outcome }}
        run: |
          if [[ "$E2E_OUTCOME" == "success" && "$PREPARE_OUTCOME" == "success" && "$INFERENCE_OUTCOME" == "success" && "$OUTPUT_OUTCOME" == "success" && "$UPLOAD_OUTCOME" == "success" ]]; then
            RELEASE_STATUS="PASS"
          else
            RELEASE_STATUS="INCOMPLETE/FAIL"
          fi
          {
            echo "## Language Model Notebook Spec v1 GPU release execution"
            echo
            echo "- Notebook candidate SHA: \`${DIMER_NOTEBOOK_REF}\`"
            echo "- Pipeline runtime revision: \`afaf1f032cd7e9751db1ee8eb71b542f9bd0b15f\`"
            echo "- Finetuner runtime revision: \`ecbab8cfbb95c061235f68c087141ab7af462b9d\`"
            echo "- Runner: \`${RUNNER_OS}\` / \`${RUNNER_ARCH}\`"
            echo "- Python: \`$(python --version 2>&1)\`"
            echo "- GPU: \`$(nvidia-smi --query-gpu=name --format=csv,noheader | head -1)\`"
            echo "- E2E QLoRA execution: \`${E2E_OUTCOME}\`"
            echo "- External-artifact staging: \`${PREPARE_OUTCOME}\`"
            echo "- Fresh-kernel ARTIFACT-INFERENCE: \`${INFERENCE_OUTCOME}\`"
            echo "- Required outputs: \`${OUTPUT_OUTCOME}\`"
            echo "- Evidence upload: \`${UPLOAD_OUTCOME}\`"
            echo "- Release evidence status: **${RELEASE_STATUS}**"
            echo "- No secret values are recorded in this summary."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail closed unless GPU execution evidence is complete
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare-inference.outcome }}
          INFERENCE_OUTCOME: ${{ steps.artifact-inference.outcome }}
          OUTPUT_OUTCOME: ${{ steps.assert-outputs.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-evidence.outcome }}
        run: |
          [[ "$E2E_OUTCOME" == "success" ]]
          [[ "$PREPARE_OUTCOME" == "success" ]]
          [[ "$INFERENCE_OUTCOME" == "success" ]]
          [[ "$OUTPUT_OUTCOME" == "success" ]]
          [[ "$UPLOAD_OUTCOME" == "success" ]]
