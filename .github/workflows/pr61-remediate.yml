name: PR 61 one-shot remediation

on:
  push:
    branches:
      - feat/dimer-model-cards
    paths:
      - .github/workflows/pr61-remediate.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dimer-model-cards
          fetch-depth: 0

      - name: Restore upstream card, complete DIMER environments, regenerate manifests
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          qwen_dir = Path("weights/qwen3-0.6b")
          smol_dir = Path("weights/smollm2-360m")

          upstream_url = (
              "https://huggingface.co/Qwen/Qwen3-0.6B/raw/"
              "c1899de289a04d12100db370d81485cdf75e47ca/README.md"
          )
          with urllib.request.urlopen(upstream_url, timeout=60) as response:
              upstream = response.read()
          if not upstream.startswith(b"---\nlibrary_name: transformers\n"):
              raise SystemExit("unexpected Qwen upstream README payload")
          (qwen_dir / "README.md").write_bytes(upstream)

          replacements = {
              qwen_dir / "MODEL_CARD.md": (
                  "The packaged configuration declares `bfloat16` weights, while DIMER supports LoRA and 4-bit QLoRA through the generic causal-LM backend with `trust_remote_code=False`. The registry records a 13.3 GiB LoRA minimum derived from an RTX 5070 Ti Laptop measurement at sequence length 2,048 and batch size 1; it records no validated QLoRA ceiling for this model. The data environment should resemble the language, register, task, and dialogue structure represented in the operator's evaluated data. Domain shift, unfamiliar dialects, adversarial prompts, or longer interactions can degrade behavior even when the software executes successfully.",
                  "The packaged configuration declares `bfloat16` base weights. In the DIMER causal-LM backend, **LoRA can execute on CPU or CUDA**, but the repository does not treat CPU execution as a qualified training profile: the compliance analysis notes that a general-purpose CPU node is not expected to finish LM SFT within the platform's six-hour budget. **QLoRA requires an NVIDIA CUDA device** in the current implementation; when `method == \"qlora\"` and CUDA is unavailable, the finetuner fails early with `RESOURCE_GPU_UNAVAILABLE` rather than falling back to CPU. The registry records a measured **13.3 GiB minimum for LoRA** on an RTX 5070 Ti Laptop at sequence length 2,048 and batch size 1. It records **no validated QLoRA VRAM ceiling** for this model, which means the resource profile is unmeasured—not that QLoRA is hardware-agnostic. ROCm, Metal/MPS, and non-CUDA quantization are not qualified by this DIMER backend. The data environment should resemble the language, register, task, and dialogue structure represented in the operator's evaluated data; domain shift, unfamiliar dialects, adversarial prompts, or longer interactions can degrade behavior even when the software executes successfully."
              ),
              smol_dir / "MODEL_CARD.md": (
                  "The snapshot configuration declares `bfloat16` weights and an 8,192-position upstream architecture, while the DIMER registry caps training examples at 2,048 rendered tokens. The generic causal-LM backend supports LoRA and 4-bit QLoRA with `trust_remote_code=False`; however, both LoRA and QLoRA resource-profile measurements are absent, so this card publishes no minimum VRAM estimate. The expected data environment is short-form, primarily English text resembling the operator's evaluated task data. Domain shift, other languages, long conversations, adversarial prompts, and differing annotation conventions can reduce quality even when loading and training complete successfully.",
                  "The snapshot configuration declares `bfloat16` base weights and an 8,192-position upstream architecture, while the DIMER registry caps training examples at 2,048 rendered tokens. In the current generic causal-LM backend, **LoRA can execute on CPU or CUDA**, but CPU LM fine-tuning is not a qualified six-hour DIMER training profile. **QLoRA requires an NVIDIA CUDA device** and fails early with `RESOURCE_GPU_UNAVAILABLE` when CUDA is unavailable; it does not silently fall back to CPU. Both LoRA and QLoRA resource-profile measurements are absent for this model, so this card publishes no minimum VRAM estimate. That absence is an evidence gap, not a claim that arbitrary hardware is supported. ROCm, Metal/MPS, and non-CUDA quantization are not qualified by this DIMER backend. The expected data environment is short-form, primarily English text resembling the operator's evaluated task data. Domain shift, other languages, long conversations, adversarial prompts, and differing annotation conventions can reduce quality even when loading and training complete successfully."
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one Environment paragraph in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          def regenerate(directory: Path, changed_paths: set[str]) -> None:
              manifest_path = directory / "dimer-base-manifest.json"
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              seen = set()
              for entry in manifest["files"]:
                  rel = entry["path"]
                  if rel in changed_paths:
                      payload = (directory / rel).read_bytes()
                      entry["bytes"] = len(payload)
                      entry["sha256"] = hashlib.sha256(payload).hexdigest()
                      seen.add(rel)
              missing = changed_paths - seen
              if missing:
                  raise SystemExit(f"manifest missing changed files: {sorted(missing)}")
              manifest["totalBytes"] = sum(int(entry["bytes"]) for entry in manifest["files"])
              manifest_path.write_text(
                  json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
                  newline="\n",
              )

          regenerate(qwen_dir, {"README.md", "MODEL_CARD.md"})
          regenerate(smol_dir, {"MODEL_CARD.md"})
          PY

      - name: Verify model-card structure and manifests
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          required = [
              "###### Description",
              "#### Intended Use and Limitations",
              "###### Primary Intended Uses",
              "###### Primary Intended Users",
              "###### Out-of-scope use cases",
              "#### Factors",
              "###### Groups",
              "###### Instrumentation",
              "###### Environment",
              "#### Metrics",
              "###### Performance Measures",
              "###### Decision thresholds",
              "###### Approaches to uncertainty and variability",
              "#### Ethical considerations and biases",
              "###### Data",
              "###### Human Life",
              "###### Mitigations",
              "###### Risks and harms",
              "###### Use cases",
          ]
          for directory in (Path("weights/qwen3-0.6b"), Path("weights/smollm2-360m")):
              card = (directory / "MODEL_CARD.md").read_text(encoding="utf-8")
              positions = [card.index(heading) for heading in required]
              assert positions == sorted(positions)
              assert "QLoRA requires an NVIDIA CUDA device" in card
              manifest = json.loads((directory / "dimer-base-manifest.json").read_text())
              for entry in manifest["files"]:
                  path = directory / entry["path"]
                  if path.exists():
                      payload = path.read_bytes()
                      assert len(payload) == entry["bytes"], entry["path"]
                      assert hashlib.sha256(payload).hexdigest() == entry["sha256"], entry["path"]
          qwen = Path("weights/qwen3-0.6b/README.md").read_text(encoding="utf-8")
          assert qwen.startswith("---\nlibrary_name: transformers\n")
          assert "# Qwen3-0.6B\n" in qwen
          assert "language-model-pipeline" not in qwen
          PY

      - name: Commit remediation and remove one-shot workflow
        run: |
          git rm .github/workflows/pr61-remediate.yml
          git add weights/qwen3-0.6b/README.md \
                  weights/qwen3-0.6b/MODEL_CARD.md \
                  weights/qwen3-0.6b/dimer-base-manifest.json \
                  weights/smollm2-360m/MODEL_CARD.md \
                  weights/smollm2-360m/dimer-base-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(model-cards): resolve reviewer P1 findings"
          git push origin HEAD:feat/dimer-model-cards
