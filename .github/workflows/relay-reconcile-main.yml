name: relay-reconcile-main
on:
  push:
    branches: [fix/notebook-spec-v1-conformance]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notebook-spec-v1-conformance
          fetch-depth: 0
      - name: Reconcile newer mainline tutorial decisions
        shell: python
        run: |
          import json
          from pathlib import Path

          main_nb_path = Path('tutorials/language_model_finetuning_colab.ipynb')
          inf_nb_path = Path('tutorials/language_model_artifact_inference_colab.ipynb')
          main_nb = json.loads(main_nb_path.read_text())
          inf_nb = json.loads(inf_nb_path.read_text())

          def source_text(cell):
              src = cell.get('source', '')
              return ''.join(src) if isinstance(src, list) else src

          changed_default = False
          for cell in main_nb['cells']:
              src = source_text(cell)
              if 'BASE_MODEL_KEY = "qwen3-1.7b"' in src:
                  cell['source'] = src.replace('BASE_MODEL_KEY = "qwen3-1.7b"', 'BASE_MODEL_KEY = "smollm2-360m"')
                  changed_default = True
              elif '[Qwen3-1.7B](https://huggingface.co/Qwen/Qwen3-1.7B)' in src:
                  cell['source'] = src.replace('[Qwen3-1.7B](https://huggingface.co/Qwen/Qwen3-1.7B)', '[SmolLM2-360M](https://huggingface.co/HuggingFaceTB/SmolLM2-360M-Instruct)')
          if not changed_default:
              raise SystemExit('expected Qwen default marker not found')

          for cell in inf_nb['cells']:
              src = source_text(cell)
              if '[Qwen3-1.7B](https://huggingface.co/Qwen/Qwen3-1.7B)' in src:
                  cell['source'] = src.replace('[Qwen3-1.7B](https://huggingface.co/Qwen/Qwen3-1.7B)', '[SmolLM2-360M](https://huggingface.co/HuggingFaceTB/SmolLM2-360M-Instruct)')

          main_nb.setdefault('metadata', {})['dimer'] = {
              'notebook_profile': 'E2E',
              'notebook_spec': '1.0',
              'capability': 'language_model_supervised_finetuning',
          }
          inf_nb.setdefault('metadata', {})['dimer'] = {
              'notebook_profile': 'ARTIFACT-INFERENCE',
              'notebook_spec': '1.0',
              'capability': 'language_model_adapter_artifact_inference',
          }
          main_nb_path.write_text(json.dumps(main_nb, ensure_ascii=False, separators=(',', ':')) + '\n')
          inf_nb_path.write_text(json.dumps(inf_nb, ensure_ascii=False, separators=(',', ':')) + '\n')

          p = Path('scripts/validate_colab_tutorials.py')
          text = p.read_text()
          text = text.replace('dimer.get("notebook_spec_version")', 'dimer.get("notebook_spec")')
          needle = '    "CUSTOM_PROMPT",\n    "tutorial_predictions.jsonl",'
          replacement = '    "CUSTOM_PROMPT",\n    \'BASE_MODEL_KEY = "smollm2-360m"\',\n    "tutorial_predictions.jsonl",'
          if needle not in text:
              raise SystemExit('validator marker insertion point not found')
          text = text.replace(needle, replacement, 1)
          p.write_text(text)

          p = Path('tests/test_colab_tutorials.py')
          text = p.read_text()
          text = text.replace('"notebook_spec_version": "1.0",\n    }', '"notebook_spec": "1.0",\n        "capability": "language_model_supervised_finetuning",\n    }', 1)
          text = text.replace('"notebook_spec_version": "1.0",\n    }', '"notebook_spec": "1.0",\n        "capability": "language_model_adapter_artifact_inference",\n    }', 1)
          text = text.replace('assert \'BASE_MODEL_KEY = "qwen3-1.7b"\' in code', 'assert \'BASE_MODEL_KEY = "smollm2-360m"\' in code')
          p.write_text(text)

          p = Path('tutorials/README.md')
          text = p.read_text().replace('metadata.dimer.notebook_spec_version = "1.0"', 'metadata.dimer.notebook_spec = "1.0"')
          anchor = 'The E2E notebook resolves a user-facing model through the canonical registry, seeds before\nmodel construction,'
          repl = 'The E2E notebook defaults to **SmolLM2-360M** for a compact tutorial run while retaining the other approved registry choices. It resolves the selected user-facing model through the canonical registry, seeds before\nmodel construction,'
          if anchor not in text:
              raise SystemExit('README E2E anchor not found')
          text = text.replace(anchor, repl, 1)
          p.write_text(text)
      - name: Self-clean and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/relay-reconcile-main.yml
          git add scripts/validate_colab_tutorials.py tests/test_colab_tutorials.py tutorials/README.md tutorials/language_model_finetuning_colab.ipynb tutorials/language_model_artifact_inference_colab.ipynb
          git commit -m 'fix: reconcile PR 62 with newer tutorial mainline'
          git push origin HEAD:fix/notebook-spec-v1-conformance
