[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmpipeline"
version = "0.1.0"
description = "Shared contracts for the DIMER language-model fine-tuning capability"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Runtime pins are exact (NOTEBOOK_SPEC 1.1 ENV2/PAR2): the standalone tutorials carry this list
# inline as their install cell, so it must resolve without the repository. The library set is
# the one the tutorials previously installed at run time; the versions without a prior tutorial
# pin (torch, datasets, pandas, PyYAML) are the ones the fleet's Windows venv executed the
# offline suite with, not clean-runtime evidence.
dependencies = [
    "PyYAML==6.0.3",
    "torch==2.14.0",
    "transformers==4.57.1",
    "tokenizers==0.22.1",
    "huggingface-hub==0.36.2",
    "peft==0.18.0",
    "accelerate==1.11.0",
    "bitsandbytes==0.49.0",
    "safetensors==0.8.0",
    "datasets==5.0.1",
    "pandas==3.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jsonschema>=4.20",
]
# `datasets` is now a pinned runtime dependency (the standalone tutorials load the pinned public
# samples with it); the extra is kept for callers that install it alone. The test suite
# deliberately does not require it: CI must not depend on network access.
fetch = [
    "datasets==5.0.1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lmpipeline = ["data/*.yaml", "schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tutorials/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
