# Canonical model registry for the DIMER language-model fine-tuning capability.
#
# This file is the runtime authority for which base models may be fine-tuned. The DIMER
# Pipeline Builder's "Base Model" field is display/provenance metadata only — see
# DEPLOYMENT.md. The authoritative runtime selector is `model_key`, supplied through
# DIMER_PREPROCESSING_ARGS_JSON and constrained to this file's keys by the finetuner's
# dimer-pipeline.json enum.
#
# Rules (see SECURITY.md):
#   - `revision` MUST be an immutable commit SHA. Never `main`, never a tag.
#   - `requires_trust_remote_code: true` entries stay `enabled: false` pending security review.
#   - `max_sequence_length` and `resource_profile` are hard ceilings. User config may narrow
#     them, never widen them.
#   - `approval_state` gates production use: experimental -> validated -> production.
#   - Do not publish `vram_gb` numbers that were not measured on approved hardware.
#   - An entry with a null `resource_profile` MUST be `internal_only: true` until measured.
#     Offering a model with no ceiling lets a user pick one that OOMs.
#
# What this registry will NOT admit, regardless of licence or hardware:
#
#   - **Anything that is not `AutoModelForCausalLM`.** `backend: generic_causal_lm` loads
#     through that class. A multimodal checkpoint — Hub task `image-text-to-text`, model
#     class `AutoModelForMultimodalLM` — is not a drop-in, and admitting one would mean a
#     new backend and a new artifact/serving contract, not a registry row. This is a
#     structural blocker: a bigger GPU does not fix it.
#     Worked example, checked 2026-08-22: `aisingapore/Qwen-SEA-LION-v4.5-27B-IT` is MIT
#     and ungated, so licence is not what stops it. It is `image-text-to-text` on `qwen3_5`
#     (`AutoModelForMultimodalLM`), and separately 27.8B — ~13.9 GB of 4-bit weights before
#     activations. The size objection is hardware-specific; the model-class one is not.
#   - **`custom_code` on the Hub.** Anything whose documented use needs
#     `trust_remote_code=True` is blocked pending review — see `phi-4-mini-instruct`, and
#     note that `aisingapore/SEA-LION-v1-7B-IT` is MIT and lists `tl` but carries the same
#     tag, so it is blocked identically.
#   - **A base model with no chat template** resolvable by `AutoTokenizer`. Post-trained /
#     instruct variants only; `chat_template: tokenizer` depends on it.
#
# Licence is a separate axis and a judgement call, not a technical gate.
#
# Philippine-language coverage, checked 2026-08-22 — the blocker is licence ALONE, and it is
# worth being precise because an earlier reading of this got it wrong twice. Both SEA-LION v3
# text models are **ungated** (fetchable with no token), are ordinary `*ForCausalLM`, carry no
# `custom_code`, and fit this GPU under QLoRA:
#
#   aisingapore/Gemma-SEA-LION-v3-9B-IT   Gemma2ForCausalLM   9.2B   license: gemma
#   aisingapore/Llama-SEA-LION-v3-8B-IT   LlamaForCausalLM    8.0B   license: llama3.1
#
# On SIZE, a correction that was measured rather than reasoned. An earlier note here argued
# 9.2B at 4-bit is ~4.6 GB of weights so size was not the objection. **That was wrong**, and
# a real run said so: gemma-sea-lion-v3-9b under QLoRA peaked at 13.17 GB on an 11.94 GB card
# (2026-08-22, tier 1, seq 1024) — it SPILLED to host RAM and ran at 0.065 examples/s against
# granite-4.1-3b's 0.538 on identical data, an ~8x collapse that measures PCIe traffic. The
# estimate counted quantized weights only and ignored activations, the bf16 adapter, optimizer
# state, and Gemma's ~256k vocabulary, whose logits tensor dominates at these lengths.
# So size IS an objection for this entry on this hardware; it may well fit DIMER's. Nor is
# `gemma` a multimodal exclusion: only the *specific*
# checkpoint google/gemma-3-4b-it is image-text-to-text. google/gemma-2-2b-it and
# google/gemma-3-1b-it are Gemma2ForCausalLM / Gemma3ForCausalLM and admissible on
# architecture; they are `gated: manual`, so they need accepted terms and a token.
#
# So adding Filipino-capable base models is a decision about accepting the Gemma or Llama 3.1
# community terms — which travel with derivatives and are not OSI-open — not an engineering
# problem. Record that decision here when it is made.

schema_version: "1.0"

models:
  qwen3-1.7b:
    enabled: true
    provider: Qwen
    model_id: Qwen/Qwen3-1.7B
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    license: apache-2.0
    architecture: causal_lm
    backend: generic_causal_lm
    requires_trust_remote_code: false
    training_methods: [lora, qlora]
    max_sequence_length: 4096
    chat_template: tokenizer
    lora_target_modules: auto
    serving_profile: peft_adapter
    approval_state: experimental
    resource_profile:
      # Measured. See COMPATIBILITY.md for method and caveats.
      lora:
        # Exceeded this 11.94 GB GPU (16.29 GB peak, driver spilled to host RAM at
        # 30 tok/s vs 341 for qlora). Not a valid measurement — needs a larger GPU.
        min_vram_gb: null
        measured_on: null
      qlora:
        min_vram_gb: 9.3
        measured_on: "RTX 5070 Ti Laptop 11.94GB, seq2048 bs1, 2026-08-21"
        measured_at:
