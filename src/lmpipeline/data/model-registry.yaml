# Canonical model registry for the DIMER language-model fine-tuning capability.
#
# This file is the runtime authority for which base models may be fine-tuned. The DIMER
# Pipeline Builder's "Base Model" field is display/provenance metadata only — see
# DEPLOYMENT.md. The authoritative runtime selector is `model_key`, supplied through
# DIMER_PREPROCESSING_ARGS_JSON and constrained to this file's keys by the finetuner's
# dimer-pipeline.json enum.
#
# Rules (see SECURITY.md):
#   - `revision` MUST be an immutable commit SHA. Never `main`, never a tag.
#   - `requires_trust_remote_code: true` entries stay `enabled: false` pending security review.
#   - `max_sequence_length` and `resource_profile` are hard ceilings. User config may narrow
#     them, never widen them.
#   - `approval_state` gates production use: experimental -> validated -> production.
#   - Do not publish `vram_gb` numbers that were not measured on approved hardware.

schema_version: "1.0"

models:
  qwen3-1.7b:
    enabled: true
    provider: Qwen
    model_id: Qwen/Qwen3-1.7B
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    license: apache-2.0
    architecture: causal_lm
    backend: generic_causal_lm
    requires_trust_remote_code: false
    training_methods: [lora, qlora]
    max_sequence_length: 4096
    chat_template: tokenizer
    lora_target_modules: auto
    serving_profile: peft_adapter
    approval_state: experimental
    resource_profile:
      # Measured. See COMPATIBILITY.md for method and caveats.
      lora:
        # Exceeded this 11.94 GB GPU (16.29 GB peak, driver spilled to host RAM at
        # 30 tok/s vs 341 for qlora). Not a valid measurement — needs a larger GPU.
        min_vram_gb: null
        measured_on: null
      qlora:
        min_vram_gb: 9.3
        measured_on: "RTX 5070 Ti Laptop 11.94GB, seq2048 bs1, 2026-08-21"
        measured_at:
          max_sequence_length: 2048
          per_device_batch_size: 1

