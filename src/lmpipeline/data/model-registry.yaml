    enabled: true
    # internal_only until measured: COMPATIBILITY.md forbids an unmeasured ceiling, and
    # offering a model whose resource_profile is null lets a user pick one that may OOM.
    # Flip this off and add the key to dimer-pipeline.json's enum once measured.
    internal_only: true
    provider: allenai
    model_id: allenai/OLMo-2-1124-7B-Instruct
    revision: 470b1fba1ae01581f270116362ee4aa1b97f4c84
