  gemma-sea-lion-v3-9b:
    # Philippine-language coverage. Lists `fil` among 13 SEA languages, and is the first
    # entry chosen for language capability rather than to prove the abstraction.
    #
    # LICENCE: `gemma`, NOT OSI-open. The Gemma Terms of Use travel with derivatives, so
    # anything fine-tuned from this inherits them and the use-restrictions apply downstream.
    # Kurt accepted those terms on 2026-08-22; that decision is what admits this entry, and
    # it is recorded here rather than left implicit. Do not treat this as precedent for
    # apache-2.0-only assumptions elsewhere in the stack.
    #
    # Ungated on the Hub (verified 2026-08-22): fetchable with no token, unlike google/*
    # Gemma, which is `gated: manual`.
    enabled: true
    # internal_only until measured -- see olmo2-7b.
    internal_only: true
    provider: aisingapore
    model_id: aisingapore/Gemma-SEA-LION-v3-9B-IT
    revision: 2b1d9316c945c31e0cedbc56014047cc3bfdfbf5
    license: gemma
    architecture: causal_lm
    backend: generic_causal_lm
    requires_trust_remote_code: false
    training_methods: [qlora]
    max_sequence_length: 4096
    chat_template: tokenizer
    lora_target_modules: auto
    serving_profile: peft_adapter
    approval_state: experimental
    resource_profile:
      # qlora only: 9.2B in bf16 is ~18.5 GB of weights alone, so LoRA cannot fit the
      # measurement GPU. Listing lora here would advertise a method that always fails.
      qlora:
        # SPILLED on the measurement GPU, so there is no valid number to publish. Measured
        # 2026-08-22: 13.17 GB peak against 11.94 GB available, i.e. the driver satisfied
        # ~1.2 GB from host RAM over PCIe. The run reported success and produced a correct
        # artifact -- spilling degrades speed, not correctness -- but 0.065 examples/s
        # against granite's 0.538 on the same data is the tell. Same treatment as
        # qwen3-1.7b/lora and granite-4.1-3b/lora above: a spilled run is not a
        # measurement. Needs a larger GPU before this entry can be measured or promoted.
        #
        # Do NOT publish 10.59 here. The tier-2 (Tagalog) run at the SAME seq=1024 cap
        # peaked at 10.59 GB and did not spill -- because that corpus is short and training
        # pads dynamically, so actual batch length, not max_sequence_length, drove the
        # activation and logits memory. Tier 1 reaches 943-token examples and spills; tier 2
        # does not. An E2E run on real data therefore measures THAT DATASET, not a ceiling.
        # Ceilings come only from measure_resource_profile.py, which pads to the full
        # max_sequence_length precisely so the number holds for any dataset.
        min_vram_gb: null
        measured_on: null

  qwen3-0.6b:
